[provider]
base_url=http://127.0.0.1:11434/v1
api_key=
model=llama3.2
system_prompt=You are Sayri, a concise and natural voice assistant. Answer in short, spoken-style sentences.
agent_mode=true
temperature=0.69999999999999996
max_tokens=512
stream=true
timeout=120
strip_patterns=<think>.*?</think>, <thought>.*?</thought>

[stt]
mode=wakeword
wake_word=hey sayri
model_size=base
language=es
mic_device=
silence_ms=500
live_transcript=true

[tts]
enabled=true
language=es_ES
voice=sharvard
quality=medium
speed=1

[ui]
orb_size=140
orb_position=top-right
autostart=true
always_on_top=true
bubble_visible=true
default_ui=orb
autostart_mode=ui
setup_complete=true
